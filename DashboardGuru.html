<!DOCTYPE html><html lang="id"><head><base target="_top"><meta charset="utf-8"><style>
body{font:14px system-ui,Arial;margin:20px;color:#253c24;background:#f8fbf4}h2{margin:0 0 8px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{background:#e7f4d8;padding:12px 20px;border-radius:12px;min-width:120px}.stat strong{display:block;font-size:24px}button,input{padding:10px;border:1px solid #a3b597;border-radius:8px}button{background:#2e6c3e;color:white;cursor:pointer}input{min-width:230px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.scroll{overflow:auto;max-height:380px}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #d2dfca;padding:8px;text-align:left;white-space:nowrap}th{background:#d7ebc8;position:sticky;top:0}#status{color:#456245}
</style></head><body><h2>📊 Dashboard Guru — Misi Si Pari</h2><p>Rekap nilai yang dikirim siswa. Hanya tersedia melalui Google Sheets milik guru.</p><div id="status">Memuat nilai…</div><div class="stats"><div class="stat">Jumlah pengiriman<strong id="count">–</strong></div><div class="stat">Rata-rata<strong id="avg">–</strong></div><div class="stat">Tertinggi<strong id="max">–</strong></div><div class="stat">Terendah<strong id="min">–</strong></div></div><div class="controls"><input id="search" placeholder="Cari nama siswa" oninput="render()"><button onclick="load()">🔄 Segarkan</button><button onclick="download()">⬇ Unduh CSV</button></div><div class="scroll"><table><thead><tr><th>Waktu</th><th>Nama siswa</th><th>Misi 1</th><th>Misi 2</th><th>Misi 3</th><th>Misi 4</th><th>Total / 100</th><th>Refleksi</th></tr></thead><tbody id="rows"></tbody></table></div><script>
let records=[];const $=id=>document.getElementById(id);function load(){$('status').textContent='Memuat dari Google Sheets…';google.script.run.withSuccessHandler(data=>{records=data||[];$('status').textContent=records.length+' pengiriman ditemukan';render()}).withFailureHandler(e=>{$('status').textContent='Gagal memuat: '+e.message}).getTeacherScores()}
function filtered(){const q=$('search').value.trim().toLowerCase();return records.filter(r=>String(r.nama||'').toLowerCase().includes(q))}
function render(){const rows=filtered(),tbody=$('rows');tbody.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const k of ['waktu','nama','misi1','misi2','misi3','misi4','total','refleksi']){const td=document.createElement('td');td.textContent=String(r[k]??'');tr.appendChild(td)}tbody.appendChild(tr)}const n=rows.map(r=>Number(r.total)).filter(Number.isFinite);$('count').textContent=rows.length;$('avg').textContent=n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(1):'–';$('max').textContent=n.length?Math.max(...n):'–';$('min').textContent=n.length?Math.min(...n):'–'}
function download(){const keys=['waktu','nama','misi1','misi2','misi3','misi4','total','refleksi'];const safe=v=>{let t=String(v??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};const csv='\ufeff'+[['Waktu','Nama siswa','Misi 1','Misi 2','Misi 3','Misi 4','Total / 100','Refleksi'].map(safe).join(','),...filtered().map(r=>keys.map(k=>safe(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Rekap_Misi_Si_Pari.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}load();
</script></body></html>
